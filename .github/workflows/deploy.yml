name: Deploy to Hostinger

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Build erzeugen
        run: npm run build

      # TODO_PRUEFEN: server-dir hängt vom FTP-Konto ab (Hauptdomain vs.
      # Addon-Domain/Subdomain bei Hostinger). Siehe OFFENE_PUNKTE.md.
      - name: Per FTP auf Hostinger übertragen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
