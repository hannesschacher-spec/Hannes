name: FTP-Ordner prüfen (Diagnose)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ordner auf dem Server auflisten
        env:
          H: ${{ secrets.PB_FTP_SERVER }}
          U: ${{ secrets.PB_FTP_USERNAME }}
          P: ${{ secrets.PB_FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "public_html/public_html/"; do
            echo "===== /$d ====="
            curl -s --ssl-reqd --user "$U:$P" "ftp://$H/$d" || echo "(nicht vorhanden)"
          done
